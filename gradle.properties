# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Only build for the two ABIs Nokia VXP/MRE binaries realistically target.
# armeabi-v7a covers 32-bit ARM devices; arm64-v8a for modern test devices
# running the emulator core in a 64-bit process (Unicorn still emulates
# 32-bit ARM guest code either way).
VXP_ABI_FILTERS=armeabi-v7a,arm64-v8a
